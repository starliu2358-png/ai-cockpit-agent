[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cockpit-agent"
version = "0.1.0"
description = "A lightweight AI cockpit agent demo with tool calling, manual RAG, safety guardrails, and evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai-agents",
  "gradio>=5",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
